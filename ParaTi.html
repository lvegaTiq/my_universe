<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Universo Animado</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    #btnStart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      background: #ffffff22;
      border: 2px solid white;
      color: white;
      cursor: pointer;
      border-radius: 12px;
      z-index: 10;
    }

    #universe {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: moveStar linear infinite;
    }

    @keyframes moveStar {
      from { transform: translateY(-100px); }
      to { transform: translateY(110vh); }
    }

    .item {
      position: absolute;
      top: -50px;
      font-size: 40px;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 5;
    }
    .item img{
        width: 110px;
        border-radius: 7px;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    #finalMessage {
      display: none;
      font-size: 40px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-shadow: 0 0 20px white;
      z-index: 20;
    }
  </style>

</head>
<body>

<div id="universe"></div>

<button id="btnStart">Iniciar</button>

<div id="finalMessage">✨ ¡Mensaje final en el universo! ✨</div>

<script>
      function createUniverse() {
    const universe = document.getElementById("universe");

    for (let i = 0; i < 300; i++) { 
      const star = document.createElement("div");
      star.classList.add("star");

      const size = Math.random() * 3 + 1;
      star.style.width = size + "px";
      star.style.height = size + "px";

      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.top = Math.random() * window.innerHeight + "px";

      star.style.animationDuration = (3 + Math.random() * 7) + "s";

      universe.appendChild(star);
    }
  }

  createUniverse();


  const items = [
    "💚", "💜", "💖", "💙", 
    "Mi corazón de melocotón", 
    "Mi príncipe", 
    "Te amo",
    "<img src='./foto1.jpeg'>",
    "Mi amorcito",
    "Mi futuro esposo",
    "<img src='./foto1.jpeg'>",
    "Mi chico perfecto",
    "Lo más hermoso",
    "Mi todo",
    "<img src='./foto2.jpeg'>",
    "Mi lugar favorito",
    "Mi ojitos lindos",
    "Sonrisa hermosa",
    "Mi novio",
    "Mi futuro",
    "<img src='./foto3.jpeg'>",
    "Mi presente",
    "Me gustas",
    "Me gustas",
    "<img src='./foto4.jpeg'>",
    "Me encantas",
    "Estoy enamorada",
    "<img src='./foto5.jpeg'>",
    "Tus ojos",
    "Tu mirada",
    "Tu forma de ser",
    "<img src='./foto6.jpeg'>",
    "Mi vida",
    "Lo mejor que me ha pasado",
    "Mi sonrisa perfecta",
    "Mi felicidad",
    "Mi corazón",
    "<img src='./foto7.jpeg'>",
    "Mi luna",
    "Tu eres todo lo que quiero",
    "Te necesito",
    "Te extraño",
    "Te adoro",
    "<img src='./foto8.jpeg'>",
  ];

  document.getElementById('btnStart').addEventListener('click', () => {
    const button = document.getElementById('btnStart');
    button.style.display = "none";

    const duration = 30000; // 30 segundos
    const endTime = Date.now() + duration;

    function createItem() {
      if (Date.now() > endTime) return;

      const element = document.createElement("div");
      element.classList.add("item");

      // contenido
      element.innerHTML = items[Math.floor(Math.random() * items.length)];

      // tamaño aleatorio
      element.style.fontSize = (20 + Math.random()*40) + "px";

      // opacidad aleatoria
      element.style.opacity = 0.7 + Math.random()*0.3;

      // espacio alrededor para que no se monten
      element.style.padding = "10px";

      // posición X aleatoria
      element.style.left = Math.random() * (window.innerWidth - 100) + "px";

      // velocidad diferente
      element.style.animationDuration = (3 + Math.random() * 4) + "s";

      document.body.appendChild(element);

      setTimeout(() => element.remove(), 6000);

      // Crear un elemento cada 250–400 ms → Ya no se amontonan
      setTimeout(createItem, 250 + Math.random()*150);
    }

    createItem();

    // Mostrar mensaje final después del tiempo
    setTimeout(() => {
      document.getElementById("finalMessage").style.display = "block";
    }, duration);
  });

</script>


</body>
</html>
